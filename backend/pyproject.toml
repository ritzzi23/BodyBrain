[project]
name = "bodybrain-backend"
version = "0.1.0"
description = "Evidence-backed anatomical memory for BodyBrain"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
  "pypdf>=6,<7",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
