<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#121419" />
    <script>
      (() => {
        let theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        try {
          const saved = localStorage.getItem('bodybrain.theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#f7f8fa' : '#121419';
      })();
    </script>
    <meta name="description" content="BodyBrain — explore your body, structure by structure. An interactive full-body anatomy atlas and a home for your personal body memory." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>BodyBrain · Your body, connected</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
